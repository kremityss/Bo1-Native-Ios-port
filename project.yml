name: BO1NativeFoundation
options:
  bundleIdPrefix: com.kremityss
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  BO1NativeFoundation:
    type: application
    platform: iOS
    sources:
      - App
      - Engine
      - path: Assets
        buildPhase: resources
        excludes: [README.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kremityss.bo1native.foundation
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
